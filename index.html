<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InterAct Lobby Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#DA6A26; --teal:#438696; --deep-teal:#2F6B79; --deep-orange:#B4561A;
  --charcoal:#231F20; --slate:#5E6470; --cream:#FAEEE7; --teal-tint:#E3EFF1; --rule:#E4DED9;
  --head:'Aleo',Georgia,serif; --body:'Inter',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#16333A;overflow:hidden}
body{font-family:var(--body);color:var(--charcoal);display:flex;align-items:center;justify-content:center}
/* fixed 1920x1080 stage, scaled to fit any screen */
#stage{position:relative;width:1920px;height:1080px;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;overflow:hidden;background:#fff}
.slide.on{opacity:1}
/* light layout */
.light{background:#fff}
.light .inner{position:absolute;left:150px;right:150px;top:96px;bottom:200px}
.eyebrow{font-family:var(--body);font-weight:600;font-size:30px;letter-spacing:.15em;text-transform:uppercase;color:var(--deep-teal)}
h1{font-family:var(--head);font-weight:700;font-size:96px;line-height:1.08;color:var(--orange);margin-top:18px}
.rule{width:220px;height:8px;background:var(--teal);margin:34px 0 40px}
p,li{font-size:46px;line-height:1.4;color:var(--charcoal)}
ul{list-style:none}
li{position:relative;padding-left:60px;margin-bottom:20px}
li::before{content:"";position:absolute;left:0;top:24px;width:22px;height:22px;border-radius:50%;background:var(--teal)}
.callout{background:var(--cream);border-left:16px solid var(--orange);padding:30px 44px;font-size:46px;line-height:1.35}
.callout b{color:var(--deep-orange)}
.foot-bar{position:absolute;left:150px;right:150px;bottom:44px;height:140px;border-top:3px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.foot-bar .web{font-size:34px;color:var(--slate);font-weight:600}
.foot-bar .logo-sm{height:118px}
.band{position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--teal);border-top:6px solid var(--orange)}
/* hero layout */
.hero{background:var(--deep-teal);color:#fff}
.hero .arc{position:absolute;left:-200px;top:-560px;width:2600px;height:1300px;border-radius:50%;border:28px solid var(--orange);border-bottom-color:transparent;border-left-color:transparent;transform:rotate(-12deg)}
.hero .inner{position:absolute;left:150px;right:150px;top:150px;bottom:120px}
.hero .eyebrow{color:#fff;opacity:.9}
.hero h1{color:#fff;font-size:128px}
.hero p{color:#fff}
.hero .logo-lg{position:absolute;right:150px;bottom:120px;width:520px}
.clock{font-family:var(--head);font-weight:600;font-size:64px;color:#fff;margin-top:20px}
/* grids */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:48px}
.card{background:var(--teal-tint);border-top:12px solid var(--teal);padding:44px 44px 48px}
.card h2{font-family:var(--head);font-weight:700;font-size:56px;line-height:1.1;color:var(--deep-teal);margin-bottom:22px}
.card p{font-size:40px}
.card .feat{margin-top:22px;font-size:32px;font-weight:700;color:var(--deep-orange)}
.foot{font-size:30px;color:var(--slate);margin-top:36px}
.values{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 48px}
.val{display:flex;gap:22px;align-items:baseline}
.val .L{font-family:var(--head);font-weight:700;font-size:110px;color:var(--orange);line-height:1;width:80px}
.val .w{font-family:var(--head);font-weight:700;font-size:46px;color:var(--deep-teal)}
.val .d{font-size:30px;line-height:1.3;color:var(--charcoal);margin-top:6px}
.qrwrap{display:flex;gap:90px;align-items:center;margin-top:40px}
.qrwrap .txt{flex:1}
.qr{flex:none;width:420px;height:420px;background:#fff;padding:24px;border:6px solid var(--teal)}
.qr svg{width:100%;height:100%;display:block}
.qrlabel{font-size:32px;color:var(--slate);text-align:center;margin-top:16px;font-weight:600}
.big{font-family:var(--head);font-weight:700;font-size:96px;color:var(--deep-teal);line-height:1}
.photo{width:520px;height:620px;object-fit:cover;border:12px solid var(--teal)}
.draft{position:absolute;top:28px;right:28px;z-index:9;background:var(--orange);color:#fff;font:700 28px var(--body);padding:10px 22px;letter-spacing:.08em}
#dots{position:absolute;left:0;right:0;bottom:48px;display:flex;justify-content:center;gap:16px;z-index:8}
#dots i{width:14px;height:14px;border-radius:50%;background:var(--rule)}
#dots i.on{background:var(--teal)}
</style>
</head>

   and stays up through the last closed day. Observed rule: Saturday holiday → Friday, Sunday → Monday.
   To add a one-off closure or skip a holiday in a given year, use CLOSURE_EXTRA / CLOSURE_SKIP. */

const CLOSURE_EXTRA = [ /* {name:'Staff training day', start:'2027-03-05', end:'2027-03-05'} */ ];
const CLOSURE_SKIP  = [ /* 'Juneteenth-2027' */ ];

  hiring:   'https://interactaba.com/join-our-team/',
  review:   {sf69:'https://search.google.com/local/writereview?placeid=ChIJBQFHtwq3jocRHv01LSlRzu8'}  // only 69th St has a Google listing
};
function qrSvg(url){
  if(typeof qrcode==='undefined') return '';
  const q=qrcode(0,'M'); q.addData(url); q.make();
  const n=q.getModuleCount(); let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#231F20"/></svg>`;
}
function qrFor(site,camp){const d=QR_DEST[camp]; if(typeof d==='object') return d[site]?qrSvg(d[site]):'';

const showAll = params.has('all');

function band(){return `<div class="foot-bar"><span class="web">interactaba.com · ${PHONE}</span><img class="logo-sm" src="${LOGO_COLOR}" alt="InterAct"></div><div class="band"></div>`}
function light(inner){return `<div class="slide light"><div class="inner">${inner}</div>${band()}</div>`}
function head(e,t){return `<div class="eyebrow">${e}</div><h1>${t}</h1><div class="rule"></div>`}
function weekIndex(){return Math.floor((Date.now()-Date.UTC(2026,0,5))/604800000)}

     <p style="margin-top:60px">Questions? Our front desk is happy to help.</p>
   </div><img class="logo-lg" style="filter:brightness(0) invert(1)" src="${LOGO_COLOR}" alt="InterAct"></div>`,
  list:s=>light(head(s.eyebrow,s.title)+`<ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`+(s.callout?`<div class="callout" style="margin-top:30px;max-width:1250px">${s.callout}</div>`:'')),
  tip:()=>{const t=HOME_TIPS[((weekIndex()%HOME_TIPS.length)+HOME_TIPS.length)%HOME_TIPS.length];
     return light(head('Try this at home · Tip of the week',t.title)+`<p style="max-width:1400px;font-size:58px">${t.body}</p><div class="callout" style="margin-top:60px;max-width:1400px;font-size:58px"><b>Try it:</b> ${t.ex}</div>`)},
  services:()=>light(head('How we help','Support where your child needs it')+`<div class="cards">
     <div class="card"><h2>Clinic-Based ABA</h2><p>Learning and play at our clinic with a trained therapist.</p></div>
     <div class="card"><h2>School-Based Support</h2><p>We team up with your child’s school.</p></div>
     <div class="card"><h2>InterAct at Home</h2><p>Help with everyday routines at home.</p><div class="feat">Now offering: Mealtime &amp; Daily Living Skills</div></div>
   </div><div class="foot">ABA = Applied Behavior Analysis. Ask the front desk to learn more.</div>`),
  text:s=>light(head(s.eyebrow,s.title)+`<p style="max-width:1300px">${s.body}</p>`+(s.big?`<div class="big" style="margin-top:40px">${s.big}</div>`:'')+(s.callout?`<div class="callout" style="margin-top:50px;max-width:1300px">${s.callout}</div>`:'')),
  qr:s=>light(`<div class="qrwrap"><div class="txt">${head(s.eyebrow,s.title)}<p>${s.body}</p></div>
     <div><div class="qr">${qrFor(site,s.qr)}</div><div class="qrlabel">${s.label}</div></div></div>`),
  values:()=>{const v=[['I','Invested','Committed to every child’s potential'],['N','Nurtured','Safe, encouraging places to grow'],['T','Talented','Skilled, evidence-based practice'],['E','Engaging','Creative teaching that holds attention'],['R','Relationships','Partnership with families'],['A','Adaptability','Plans that change with your child'],['C','Compassion','Empathy and respect, every time'],['T','Trustworthy','Honest, transparent, private']];
     return light(head('What we believe','Our values spell INTERACT')+`<div class="values">${v.map(x=>`<div class="val"><div class="L">${x[0]}</div><div><div class="w">${x[1]}</div><div class="d">${x[2]}</div></div></div>`).join('')}</div>`)},
  team:s=>light(`<div class="qrwrap">${s.photo?`<img class="photo" src="${s.photo}" alt="">`:'<div class="photo" style="background:var(--teal-tint)"></div>'}<div class="txt">${head(s.eyebrow,s.name)}<p><b>${s.role}</b></p><p style="margin-top:24px">${s.fact}</p></div></div>`)
};

/* ---- holiday math ---- */
const D=(y,m,d)=>new Date(Date.UTC(y,m-1,d));
const iso=d=>d.toISOString().slice(0,10);
const addDays=(d,n)=>new Date(d.getTime()+n*86400000);
const nthWeekday=(y,m,wd,n)=>{let d=D(y,m,1);while(d.getUTCDay()!==wd)d=addDays(d,1);return addDays(d,7*(n-1))};
const lastWeekday=(y,m,wd)=>{let d=D(y,m+1,1);d=addDays(d,-1);while(d.getUTCDay()!==wd)d=addDays(d,-1);return d};
const observed=d=>d.getUTCDay()===6?addDays(d,-1):d.getUTCDay()===0?addDays(d,1):d;
const nextWeekday=d=>{let x=addDays(d,1);while([0,6].includes(x.getUTCDay()))x=addDays(x,1);return x};
function closuresFor(y){
  const one=(name,d,note)=>({name,key:name+'-'+y,start:iso(d),end:iso(d),note});
  const tg=nthWeekday(y,11,4,4);
  // winter break: every weekday from Dec 24 through Jan 1 (2026-27 staff calendar pattern)
  const ws=observed(D(y,12,24)), we=observed(D(y+1,1,1));
  return [
    one('Martin Luther King Jr. Day',nthWeekday(y,1,1,3)),
    one('Presidents Day',nthWeekday(y,2,1,3)),
    one('Memorial Day',lastWeekday(y,5,1)),
    one('Juneteenth',observed(D(y,6,19))),
    one('Independence Day',observed(D(y,7,4))),
    one('Labor Day',nthWeekday(y,9,1,1)),
    {name:'Thanksgiving',key:'Thanksgiving-'+y,start:iso(tg),end:iso(addDays(tg,1)),note:'Happy Thanksgiving from all of us at InterAct!'},
    {name:'winter break',key:'winter break-'+y,start:iso(ws),end:iso(we),note:'Wishing your family a happy, restful break.'}
  ];
}
const fmtDay=s=>{const d=new Date(s+'T12:00:00Z');return d.toLocaleDateString('en-US',{timeZone:'UTC',weekday:'long',month:'short',day:'numeric'}).replace(/(\w{3}) (\d)/,'$1. $2').replace('May.','May').replace('Jun.','June').replace('Jul.','July')};
function upcomingClosure(){
  const y=+today.slice(0,4);
  const list=[...closuresFor(y-1),...closuresFor(y),...closuresFor(y+1),...CLOSURE_EXTRA.map(c=>({...c,key:c.name}))]
    .filter(c=>!CLOSURE_SKIP.includes(c.key))
    .filter(c=>{const lead=c.start===c.end?CLOSURE_LEAD_DAYS.single:CLOSURE_LEAD_DAYS.multi;
      return today>=iso(addDays(new Date(c.start+'T00:00:00Z'),-lead)) && today<=c.end})
    .sort((a,b)=>a.start<b.start?-1:1);
  return list[0]||null;
}
R.closure=()=>{const c=upcomingClosure(); if(!c) return '';
  const back=fmtDay(iso(nextWeekday(new Date(c.end+'T00:00:00Z'))));
  const days=c.start===c.end?`${fmtDay(c.start)} for ${c.name}`:
    (iso(addDays(new Date(c.start+'T00:00:00Z'),1))===c.end?`${fmtDay(c.start)} and ${fmtDay(c.end)}`:`${fmtDay(c.start)} through ${fmtDay(c.end)}`);
  const title='Closed for '+c.name;
  return R.text({eyebrow:'Holiday hours',title,body:`All clinics are closed ${days}. We’re back ${back}.`,callout:c.note||`Questions? Call <b>${PHONE}</b>.`});
};
const inWindow=(s)=>{const t=(s.start&&s.start.length===5)?today.slice(5):today;
  if(s.start && t < s.start) return false;
  if(s.end && t > s.end) return false; return true};

const active = SLIDES.filter(s=>{
  if(showAll) return true;
  if(s.on===false) return false;
  if(!inWindow(s)) return false;
  if(s.until && new Date().toLocaleString('sv-SE',{timeZone:tz}).replace(' ','T') > s.until) return false;
  if(s.type==='closure' && !upcomingClosure()) return false;
  if(s.sites && !s.sites.includes(site)) return false;
  return true;
});

const stage = document.getElementById('stage');
stage.innerHTML = active.map(s=>R[s.type](s)).join('') +
  (DRAFT?'<div class="draft">DRAFT v1</div>':'') +
  `<div id="dots">${active.map(()=>'<i></i>').join('')}</div>`;
const slides=[...stage.querySelectorAll('.slide')], dots=[...stage.querySelectorAll('#dots i')];

function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${k})`}
addEventListener('resize',fit); fit();

function tick(){const d=new Date();
  const s=d.toLocaleDateString('en-US',{timeZone:tz,weekday:'long',month:'long',day:'numeric'})+' · '+
          d.toLocaleTimeString('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit'}).toLowerCase();
  stage.querySelectorAll('[data-clock]').forEach(e=>e.textContent=s)}
tick(); setInterval(tick,15000);

let i = pin!==null ? Math.min(pin,slides.length-1) : 0;
function show(n){slides.forEach((s,k)=>s.classList.toggle('on',k===n));dots.forEach((d,k)=>d.classList.toggle('on',k===n))}
show(i);
if(pin===null) setInterval(()=>{i=(i+1)%slides.length;show(i)},SECONDS_PER_SLIDE*1000);

/* Pick up content changes every 20 min — only reloads if the page is reachable, so a Wi-Fi blip never blanks the screen */
setInterval(()=>{fetch(location.href,{cache:'no-store'}).then(r=>{if(r.ok)location.reload()}).catch(()=>{})},20*60*1000);
</script>
